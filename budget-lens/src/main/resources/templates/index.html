<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

<div class="container mt-4">
    <a class="btn btn-primary" href="#" th:if="${isAuthenticated}" th:href="@{/logout}">Logout</a>

    <h1>New expense</h1>

    <a  class="btn btn-primary" href="#" th:if="${!isAuthenticated}" th:href="@{/login}">Login</a>

    <form th:if="${isAuthenticated}" action="#" th:action="@{/submitExpense}"
    th:object="${expenseRequest}" method="POST">

        <div class="input-group mb-3">
            <label class="input-group-text" for="note">Note:</label>
            <input class="form-control" type="text" id="note" th:field="*{note}" />
            <span th:if="${#fields.hasErrors('note')}" th:errors="*{note}" style="color: red;"></span>
        </div>

        <div class="input-group mb-3">
            <label class="input-group-text" for="cost">Cost (€):</label>
            <input class="form-control" type="number" step="0.01" id="cost" th:field="*{cost}" min="1" required />
            <span th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}" style="color: red;"></span>
        </div>

        <div class="input-group mb-3">
            <label class="input-group-text" for="expenseDate">Date of the cost:</label>
            <input class="form-control" type="date" id="expenseDate" th:field="*{expenseDate}" required />
            <span th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}" style="color: red;"></span>
        </div>

        <div class="input-group mb-3">
            <label class="input-group-text" for="frequencyId">frequency:</label>
            <select  class="form-select" id="frequencyId" th:field="*{frequencyId}" required>
                <option value="">Choose frequency</option>
                <option th:each="freq : ${frequencies}"
                        th:value="${freq.id}"
                        th:text="${freq.description}">Mesečno</option>
            </select>
            <span th:if="${#fields.hasErrors('frequencyId')}" th:errors="*{frequencyId}" style="color: red;"></span>
        </div>

        <div class="input-group mb-3">
            <label class="input-group-text" for="categoryId">Kategorija:</label>
            <select  class="form-select" id="categoryId" th:field="*{categoryId}" required>
                <option value="">Choose category</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}">Hrana</option>
            </select>
            <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color: red;"></span>
        </div>

        <div class="input-group mb-3">
            <input class="btn btn-primary" type="submit" value="Submit" />
            <input class="btn btn-secondary" type="reset" value="Reset" />
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <p th:text="${error}"></p>
        </div>

    </form>

    <h1 class="mb-2">Expense list</h1>
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>Note</th>
            <th>Cost</th>
            <th>Total cost in a year</th>
            <th>Actions</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="accessInfo: ${expenses}">
            <td>
                <div th:text="${{accessInfo.note()}}"></div>
            </td>
            <td>
                <div th:text="${{accessInfo.cost()}}"></div>
            </td>
            <td>
                <div th:text="${{accessInfo.totalCost()}}"></div>
            </td>
            <td>

                <form th:action="@{/deleteExpense/{id}(id=${accessInfo.id})}" th:method="DELETE"
                      style="display:inline;">

                    <button type="submit" class="btn btn-link p-0">
                        <i class="bi bi-trash-fill"></i> Delete
                    </button>
                </form>
            </td>

        </tr>
        </tbody>
    </table>

    <div class="input-group mb-3">

        <a th:href="@{/?pageNumber={pageNum}(pageNum=${pageNumber-1})}" class="btn btn-link p-0">
            <i class="bi bi-fill"></i> Page <span th:text="${pageNumber-1}"></span>
        </a>
        <a th:href="@{/?pageNumber={pageNum}(pageNum=${pageNumber+1})}" class="btn btn-link p-0">
            <i class="bi bi-fill"></i> Page <span th:text="${pageNumber+1}"></span>
        </a>
    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
