<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

<div class="container mt-4">
    <div class="row">
        <div class="col">
            <a class="btn btn-primary" href="#" th:if="${isAuthenticated}" th:href="@{/logout}">Logout</a>

            <h1>New expense</h1>

            <div th:if="${!isAuthenticated}">
                Login to add new expense
                <a  class="btn btn-primary" href="#" th:href="@{/login}">Login</a>
            </div>

            <form th:if="${isAuthenticated}" action="#" th:action="@{/submitExpense}"
                  th:object="${budgetRequest}" method="POST">

                <div class="input-group mb-3">
                    <label class="input-group-text" for="note">Note:</label>
                    <input class="form-control" type="text" id="note" th:field="*{note}" />
                    <span th:if="${#fields.hasErrors('note')}" th:errors="*{note}" style="color: red;"></span>
                </div>

                <div class="input-group mb-3">
                    <label class="input-group-text" for="quota">Cost (€):</label>
                    <input class="form-control" type="number" step="0.01" id="quota" th:field="*{quota}" min="1" required />
                    <span th:if="${#fields.hasErrors('quota')}" th:errors="*{quota}" style="color: red;"></span>
                </div>

                <div class="input-group mb-3">
                    <label class="input-group-text" for="frequencyId">frequency:</label>
                    <select  class="form-select" id="frequencyId" th:field="*{frequencyId}" required>
                        <option value="">Choose frequency</option>
                        <option th:each="freq : ${frequencies}"
                                th:value="${freq.id}"
                                th:text="${freq.description}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('frequencyId')}" th:errors="*{frequencyId}" style="color: red;"></span>
                </div>

                <div class="input-group mb-3">
                    <label class="input-group-text" for="categoryId">Kategorija:</label>
                    <select  class="form-select" id="categoryId" th:field="*{categoryId}" required>
                        <option value="">Choose category</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" style="color: red;"></span>
                </div>

                <div class="input-group mb-3">
                    <input class="btn btn-primary" type="submit" value="Submit" />
                    <input class="btn btn-secondary" type="reset" value="Reset" />
                </div>

                <div th:if="${error}" class="alert alert-danger">
                    <p th:text="${error}"></p>
                </div>

            </form>
        </div>
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Note</th>
                    <th>Quota</th>
                    <th>Category</th>
                    <th>Frequency</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="budget: ${budgets}">
                    <td>
                        <div th:text="${{budget.note()}}"></div>
                    </td>
                    <td>
                        <div th:text="${{budget.quota()}}"></div>
                    </td>
                    <td>
                        <!-- TODO: Get category, frequency by id-->
                        <th:block th:if="${budget.categoryId() != null}">
                            <div th:text="${{T(com.matej2.budget_lens.utils.RecordUtils).getCategoryById(categories, budget.categoryId()).name()}}"></div>
                        </th:block>
                        <th:block th:unless="${budget.categoryId() != null}">
                            <div>No category</div>
                        </th:block>
                    </td>
                    <td>
                        <th:block th:if="${budget.frequencyId() != null}">
                            <div th:text="${{T(com.matej2.budget_lens.utils.RecordUtils).getFrequencyById(frequencies, budget.frequencyId()).description()}}"></div>
                        </th:block>
                        <th:block th:unless="${budget.frequencyId() != null}">
                            <div>No frequency</div>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row">
        <h1 class="mb-2">Expense list</h1>

        <form method="post" th:action="@{/uploadCsv}" enctype="multipart/form-data">
            <div class="form-group">
                <input type="file" name="file" accept="text/csv" class="form-control-file">
            </div>
            <button type="submit" class="btn btn-primary">Upload file</button>
        </form>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>Note</th>
                <th>Category</th>
                <th>Cost</th>
                <th>Actions</th>

            </tr>
            </thead>
            <tbody>
            <tr th:each="expense: ${expenses}">
                <td>
                    <div th:text="${{expense.note()}}"></div>
                </td>
                <td>
                    <th:block th:if="${expense.category() != null}">
                        <div th:text="${{categories.get(expense.category()-1).name()}}"></div>
                    </th:block>
                    <th:block th:unless="${expense.category() != null}">
                        <div>No category</div>
                    </th:block>
                </td>
                <td>
                    <div th:text="${{expense.cost()}}"></div>
                </td>
                <td>

                    <form th:action="@{/deleteExpense/{id}(id=${expense.id})}" th:method="DELETE"
                          style="display:inline;">

                        <button type="submit" class="btn btn-link p-0">
                            <i class="bi bi-trash-fill"></i> Delete
                        </button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

        <div class="input-group mb-3">

            <a th:href="@{/?pageNumber={pageNum}(pageNum=${pageNumber-1})}" class="btn btn-link p-0">
                <i class="bi bi-fill"></i> Page <span th:text="${pageNumber-1}"></span>
            </a>
            <a th:href="@{/?pageNumber={pageNum}(pageNum=${pageNumber+1})}" class="btn btn-link p-0">
                <i class="bi bi-fill"></i> Page <span th:text="${pageNumber+1}"></span>
            </a>
        </div>
    </div>

    <div class="row">
        <h1 class="mb-2">Insight list</h1>
        <table class="table table-striped" th:if="${!insights.isEmpty()}">
            <thead>
            <tr>
                <th>Year/month</th>
                <th>Average</th>
                <th>Category</th>
                <th>Standard deviation</th>
                <th>Standard deviation percent</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="group : ${insights}">
                <tr th:each="insight, stat: ${group.value}">
                    <td th:if="${stat.first}" th:rowspan="${group.value.size()}" class="align-middle">
                        <div th:text="${{group.key}}"></div>
                    </td>
                    <td>
                        <div th:text="${{categories.get(insight.category().id()-1).name()}}"></div>
                    </td>
                    <td>
                        <div th:text="${{insight.avg()}}"></div>
                    </td>
                    <td>
                        <div th:text="${{insight.stdDev()}}"></div>
                    </td>
                    <td>
                        <div th:text="${{insight.stddevPercent()}}"></div>
                    </td>
                </tr>

            </th:block>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    document.getElementById('expenseDate').valueAsDate = new Date();
</script>
</body>
</html>
