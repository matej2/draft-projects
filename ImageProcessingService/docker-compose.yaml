
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile-app
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: broker:9092
    depends_on:
      - broker
      - mongodb
  mongodb:
    build:
      context: .
      dockerfile: ./Dockerfile-mongo
    ports:
      - "27017:27017"
  broker:
    build:
      context: .
      dockerfile: ./Dockerfile-kafka
    container_name: broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      BROKER_URL: broker

    volumes:
      - kafka_kraft:/var/lib/kafka/data

volumes:
  kafka_kraft:

