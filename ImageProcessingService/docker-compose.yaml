
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile-app
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: broker:9092
      OPENSEARCH_URL: opensearch-node
    depends_on:
      - broker
      - mongodb
  mongodb:
    build:
      context: .
      dockerfile: ./Dockerfile-mongo
    ports:
      - "27017:27017"
  broker:
    build:
      context: .
      dockerfile: ./Dockerfile-kafka
    container_name: broker
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

    volumes:
      - kafka_kraft:/var/lib/kafka/data
  es-1:
    image: elasticsearch:7.8.1
    ports:
    - "9100:9100"
    - "9200:9200"
    volumes:
    - "data-es1:/usr/share/elasticsearch/data"
  es-2:
    image: elasticsearch:7.8.1
    ports:
    - "9300:9300"
    - "9400:9400"
    volumes:
    - "data-es2:/usr/share/elasticsearch/data"
  es-3:
    image: elasticsearch:7.8.1
    ports:
    - "9500:9500"
    - "9600:9600"
    volumes:
    - "data-es3:/usr/share/elasticsearch/data"
  kibana:
    image: kibana:9.4.3
    ports:
    - "5601:5601"
  opensearch:
    container_name: opensearch-node
    image: opensearchproject/opensearch:3.8.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ChangeMe!123
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data1:/usr/share/opensearch/data # Creates volume called opensearch-data1 and mounts it to the container
    networks:
      - opensearch-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest # Make sure the version of opensearch-dashboards matches the version of opensearch installed on other nodes
    container_name: opensearch-dashboards
    ports:
      - 5601:5601 # Map host port 5601 to container port 5601
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ChangeMe!123
    networks:
      - opensearch-net

volumes:
  kafka_kraft:
  data-es1:
  data-es2:
  data-es3:
  opensearch-data1:

networks:
  opensearch-net: