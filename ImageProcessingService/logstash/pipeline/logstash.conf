input {
  beats {
    port => 5044
  }
}

filter {
  # If the app logs JSON to stdout, parse it into structured fields.
  if [message] =~ /^\s*\{.*\}\s*$/ {
    json {
      source => "message"
      target => "app"
    }
  }

  # Promote a useful docker metadata field or two to the top level for
  # easier filtering in OpenSearch Dashboards.
  if [container][name] {
    mutate {
      add_field => { "container_name" => "%{[container][name]}" }
    }
  }
  if [container][image][name] {
    mutate {
      add_field => { "container_image" => "%{[container][image][name]}" }
    }
  }

  # Drop Beats/ECS bookkeeping fields you don't need indexed.
  mutate {
    remove_field => ["agent", "ecs", "input", "log", "@version", "container"]
  }
}

output {
  opensearch {
    hosts                         => ["https://opensearch:9200"]
    user                          => "admin"
    password                      => "${OPENSEARCH_PASSWORD}"
    ssl                           => true
    ssl_certificate_verification  => false
    index                         => "docker-logs-%{+YYYY.MM.dd}"
    ecs_compatibility             => disabled
    manage_template                => false
  }

  # Uncomment while debugging to see events in the Logstash container logs
  # stdout { codec => rubydebug }
}