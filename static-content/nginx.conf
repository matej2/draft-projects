http {
    include mime.types;
    upstream backendserver {
        server 127.0.0.1:5000;
        server 127.0.0.1:6000;
        server 127.0.0.1:7000;
    }

    server {
        listen 8080;
        root /home/matej/Projekti/draft-projects/static-content;

        location / {
            proxy_pass http://backendserver/;
        }

        location /fruits {
            root /home/matej/Projekti/draft-projects/static-content;
        }

        location /carbs {
            alias  /home/matej/Projekti/draft-projects/static-content/fruits;
        }

        location /vegetables {
            root /home/matej/Projekti/draft-projects/static-content;
            try_files /vegetables/veggies.html /index.html =404;
        }

        location ~* /count/[0-9] {
            root /home/matej/Projekti/draft-projects/static-content;
            try_files /index.html =404;
        }
        
        location /crops {
            return 307 /fruits;
        }

        rewrite ^/number/(\w+) /count/$1;

    }


}

events {}
