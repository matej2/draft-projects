<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="container mt-4">

    <h1 class="mb-2">Access info list</h1>
    <table class="table">
        <thead class="table-dark">
            <tr>
                <th>Created datetime</th>
                <th>IP Address</th>
                <th>Calls</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="accessInfo: ${accessInfoList}">
                <td>
                    <div th:text="${{accessInfo.getCreated()}}"></div>
                </td>
                <td>
                    <div th:text="${{accessInfo.getIp()}}"></div>
                </td>
                <td>
                    <div th:style="${accessInfo.getNumOfCallsLastMinute() >= rateLimit ? 'color:red' : 'color:green' }"
                         th:text="${{accessInfo.getNumOfCallsLastMinute()}}"></div>
                </td>

            </tr>
        </tbody>
    </table>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
