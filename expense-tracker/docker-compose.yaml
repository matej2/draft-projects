services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
      APP_PASS: apppass
      SEED_PASS: seedpass
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/01-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql
  pgweb:
    container_name: pgweb
    restart: always
    image: sosedoff/pgweb
    ports:
      - 8081:8081
    links:
      - db:db
    environment:
      - PGWEB_DATABASE_URL=postgres://admin:mysecretpassword@db:5432/mydatabase?sslmode=disable
    depends_on:
      - db
  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydatabase
      SPRING_DATASOURCE_PASSWORD: "changeme"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "80:80"

volumes:
  postgres_data: